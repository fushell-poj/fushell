name: Bootstrap zig-clap dependency

on:
  push:
    branches: [refactor/zig-clap-cli]
    paths: [.github/workflows/bootstrap-zig-clap.yml]

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Collect source snapshots (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review"
          git archive HEAD | gzip > "$RUNNER_TEMP/review/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/review/source-commit.txt"
          git clone --quiet https://github.com/Hejsil/zig-clap "$RUNNER_TEMP/clap"
          git -C "$RUNNER_TEMP/clap" archive --prefix=clap/ 8d97efa1ee1e575443c7888d5c38e1c3fc145cf5 | gzip > "$RUNNER_TEMP/review/clap.tar.gz"
          git -C "$RUNNER_TEMP/clap" show --stat bf56f229ed5b6c381d90e192234913c6deb3f688 > "$RUNNER_TEMP/review/clap-transition.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-refactor-sources
          path: ${{ runner.temp }}/review/
          retention-days: 1
  nix-deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Regenerate deps.nix
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y nix-bin
          mkdir -p "$RUNNER_TEMP/nix-result"
          sudo -H nix --extra-experimental-features 'nix-command flakes' run github:nix-community/zon2nix > "$RUNNER_TEMP/nix-result/deps.nix"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-refactor-nix-deps
          path: ${{ runner.temp }}/nix-result/deps.nix
          retention-days: 1
