name: Zig build and unit tests

on:
  push:
    branches: [main, 'fix/architecture-review-20260907']
  pull_request:

permissions:
  contents: read

concurrency:
  group: zig-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev wayland-protocols libegl-dev libgles-dev \
            libxkbcommon-dev libfontconfig-dev libdbus-1-dev curl xz-utils
      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://ziglang.org/download/index.json -o "$RUNNER_TEMP/zig-index.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys, urllib.request, hashlib
          root = pathlib.Path(sys.argv[1])
          release = json.loads((root / 'zig-index.json').read_text())['0.16.0']['x86_64-linux']
          archive = root / 'zig.tar.xz'
          urllib.request.urlretrieve(release['tarball'], archive)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != release['shasum']:
              raise SystemExit('Zig archive checksum mismatch')
          PY
          mkdir -p "$RUNNER_TEMP/zig" "$ZIG_GLOBAL_CACHE_DIR/tmp"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          test "$(zig version)" = 0.16.0
          zig build
          zig test src/flutter_engine_store.zig
          zig build test
          zig build -Doptimize=ReleaseFast
      # Temporary source-review fixtures, removed once review is complete.
      # This archive deliberately excludes credentials and Git configuration.
      - name: Collect review workspace
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/review-workspace/sysroot/usr/lib/x86_64-linux-gnu"
          git archive HEAD | gzip > "$RUNNER_TEMP/review-workspace/source.tar.gz"
          if test -d "$ZIG_GLOBAL_CACHE_DIR/p"; then
            tar -czf "$RUNNER_TEMP/review-workspace/zig-packages.tar.gz" -C "$ZIG_GLOBAL_CACHE_DIR" p
          fi
          sysroot="$RUNNER_TEMP/review-workspace/sysroot"
          cp -a /usr/include "$sysroot/usr/"
          mkdir -p "$sysroot/usr/bin" "$sysroot/usr/lib/x86_64-linux-gnu/pkgconfig"
          cp /usr/bin/wayland-scanner "$sysroot/usr/bin/"
          for stem in libwayland-client libwayland-egl libxkbcommon libEGL libGLESv2 libfontconfig libfreetype libdbus-1 libffi libexpat; do
            cp -a /usr/lib/x86_64-linux-gnu/"$stem".so* "$sysroot/usr/lib/x86_64-linux-gnu/" || true
          done
          cp -a /usr/lib/x86_64-linux-gnu/dbus-1.0 "$sysroot/usr/lib/x86_64-linux-gnu/"
          cp -a /usr/lib/x86_64-linux-gnu/pkgconfig/*.pc "$sysroot/usr/lib/x86_64-linux-gnu/pkgconfig/"
          tar -czf "$RUNNER_TEMP/review-workspace/sysroot.tar.gz" -C "$sysroot" .
          rm -rf "$sysroot"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-workspace
          path: ${{ runner.temp }}/review-workspace/
          retention-days: 1
