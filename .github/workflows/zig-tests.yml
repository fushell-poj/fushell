name: Zig build and unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev wayland-protocols libegl-dev libgles-dev \
            libxkbcommon-dev libfontconfig-dev libdbus-1-dev curl xz-utils
      # cache v5 uses Node 24, like the existing checkout v6; hosted runners support it.
      # Cache only the verified toolchain, never the download index or credentials.
      - name: Restore Zig 0.16.0 toolchain
        id: zig-toolchain
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/zig
          key: zig-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0
      - name: Install Zig 0.16.0
        if: steps.zig-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://ziglang.org/download/index.json -o "$RUNNER_TEMP/zig-index.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import urllib.request

          root = pathlib.Path(sys.argv[1])
          release = json.loads((root / 'zig-index.json').read_text())['0.16.0']['x86_64-linux']
          archive = root / 'zig.tar.xz'
          urllib.request.urlretrieve(release['tarball'], archive)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != release['shasum']:
              raise SystemExit('Zig archive checksum mismatch')
          PY
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
      - name: Fingerprint native build environment
        id: native-deps
        shell: bash
        run: |
          set -euo pipefail
          # Include transitive libraries, headers and compiler/tool updates from apt.
          digest=$(dpkg-query -W -f='${binary:Package}=${Version}\n' | LC_ALL=C sort | sha256sum)
          echo "hash=${digest%% *}" >> "$GITHUB_OUTPUT"
      # Keep dependencies and compiler artifacts, not zig-out, Flutter, or the checkout.
      # Restore older source/dependency snapshots only within the same native environment;
      # Zig's own content hashes decide which artifacts can actually be reused.
      - name: Restore Zig dependency and compiler caches
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ZIG_GLOBAL_CACHE_DIR }}
            .zig-cache
          key: zig-build-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-0.16.0-${{ steps.native-deps.outputs.hash }}-${{ hashFiles('build.zig.zon') }}-${{ hashFiles('build.zig', 'src/**', 'vendor/**', 'packages/**', 'tests/**', '.github/workflows/zig-tests.yml') }}
          restore-keys: |
            zig-build-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-0.16.0-${{ steps.native-deps.outputs.hash }}-${{ hashFiles('build.zig.zon') }}-
            zig-build-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-0.16.0-${{ steps.native-deps.outputs.hash }}-
      - name: Configure Zig environment
        shell: bash
        run: |
          # Run on cache hits too: ZIP dependency fetches require this directory.
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Debug build
        run: |
          test "$(zig version)" = 0.16.0
          zig build --summary all
      - name: CLI smoke checks
        run: bash tests/cli_smoke.sh ./zig-out/bin/fushell
      - name: Unit tests
        run: zig build test --summary all
      - name: ReleaseFast build
        run: zig build -Doptimize=ReleaseFast --summary all
      - name: Install Flutter for doctor project diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter" >> "$GITHUB_ENV"
      - name: Doctor with real Flutter project metadata
        shell: bash
        run: bash tests/doctor_flutter_smoke.sh ./zig-out/bin/fushell
