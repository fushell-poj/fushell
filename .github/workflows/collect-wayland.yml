name: Collect Wayland build metadata
on:
  push:
    branches: ['fix/architecture-review-20260907']
    paths: ['.github/workflows/collect-wayland.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install build metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libwayland-bin libffi-dev
          tar -czf "$RUNNER_TEMP/wayland-metadata.tar.gz" /usr/share/wayland /usr/share/pkgconfig/wayland-scanner.pc
      - uses: actions/upload-artifact@v7
        with:
          name: wayland-metadata
          path: ${{ runner.temp }}/wayland-metadata.tar.gz
          retention-days: 1
