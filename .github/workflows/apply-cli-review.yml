name: Verify CLI refactor

on:
  push:
    branches: [refactor/zig-clap-cli]
    paths: [.github/workflows/apply-cli-review.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
    steps:
      - uses: actions/checkout@v6
      - name: Apply checksum-verified source changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          blobs = [
              'b08fc3247cee4696677c3420344c1a4d7601111f',
              '8d287c9cca4ca0b833b88457d230c455c0312d82',
              'af4e1d054d32b7a9351ec9cdde0d39c88925776b',
              'cc04d3025f465d650d6712a84393663b0199a86b',
              '6063e64705465e3f07aebb2538f73f641015645d',
              'bce8ff4f8c2bb6170a57e518102bf4377b926c5c',
              '4863bc6adbb8d836ae4d4c21559c4a525af28b0f',
              '47514c9bf613880e49ae6a35292338f811542178',
              'f680d2c175e1550d07702eabdb766e5559b0413a',
              '567784d781e4825a0000fcbdb33c431178119254',
              '94268180587fd6588fc4a6e8696079adec7e63fd',
              '10ad99ee902b12946c1138a4a16f0677e1124ebc',
          ]
          payload = b''
          for sha in blobs:
              reply = json.loads(subprocess.check_output(['gh', 'api', f'repos/fushell-poj/fushell/git/blobs/{sha}']))
              block = base64.b64decode(reply['content'])
              actual = hashlib.sha1(b'blob ' + str(len(block)).encode() + b'\0' + block).hexdigest()
              if actual != sha:
                  raise SystemExit('source transfer blob mismatch')
              payload += block
          if hashlib.sha256(payload).hexdigest() != 'e3b2c42c8385c7305c53609ed4f2ecc6e4ab69bc4c5c30d2058d4e901f13a776':
              raise SystemExit('source transfer checksum mismatch')
          edits = json.loads(zlib.decompress(payload))
          def checked_path(value):
              path = pathlib.Path(value)
              if path.is_absolute() or '..' in path.parts or path.parts[0] in ('.git', '.github'):
                  raise SystemExit(f'unsafe source path: {value}')
              return path
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          # Snapshot all inputs before changing any file: moved command bodies
          # borrow ranges from the original CLI entry point.
          outputs = []
          for edit in edits:
              path = checked_path(edit['path'])
              actual = digest(path.read_bytes()) if path.exists() else None
              if actual != edit['before']:
                  raise SystemExit(f'concurrent source change: {path}')
              source = checked_path(edit['source']).read_text() if edit['source'] else ''
              if digest(source.encode()) != edit['source_sha']:
                  raise SystemExit(f'source preimage mismatch: {path}')
              if edit['chunks'] is None:
                  data = None
              else:
                  data = ''.join(c if isinstance(c, str) else source[c[0]:c[1]] for c in edit['chunks']).encode()
                  if digest(data) != edit['after']:
                      raise SystemExit(f'reconstructed source mismatch: {path}')
              outputs.append((path, data, edit['mode']))
          for path, data, mode in outputs:
              if data is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
                  path.chmod(mode)
          subprocess.run(['git', 'add', '--', *[str(p) for p, _, _ in outputs]], check=True)
          PY
          git diff --cached --check
      - name: Install native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev wayland-protocols libegl-dev libgles-dev \
            libxkbcommon-dev libfontconfig-dev libdbus-1-dev curl xz-utils
      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://ziglang.org/download/index.json -o "$RUNNER_TEMP/zig-index.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import hashlib, json, pathlib, sys, urllib.request
          root = pathlib.Path(sys.argv[1])
          release = json.loads((root / 'zig-index.json').read_text())['0.16.0']['x86_64-linux']
          archive = root / 'zig.tar.xz'
          urllib.request.urlretrieve(release['tarball'], archive)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != release['shasum']:
              raise SystemExit('Zig archive checksum mismatch')
          PY
          mkdir -p "$RUNNER_TEMP/zig" "$ZIG_GLOBAL_CACHE_DIR/tmp"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Format check
        run: zig fmt --check build.zig src/fushell.zig src/cli src/commands
      - name: Debug build
        run: |
          test "$(zig version)" = 0.16.0
          zig build --summary all
      - name: CLI smoke checks
        run: bash tests/cli_smoke.sh ./zig-out/bin/fushell
      - name: Unit tests
        run: zig build test --summary all
      - name: ReleaseFast build
        run: |
          zig build -Doptimize=ReleaseFast --summary all
          bash tests/cli_smoke.sh ./zig-out/bin/fushell
      - name: Publish verified refactor to the review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(cli): replace hand-written parsing with pinned zig-clap' \
            -m 'Use typed command options, grammar-derived help and strict diagnostics. Separate build/run/SDK execution from parsing, preserve opaque application argv, and regenerate the Nix dependency cache. Verified with Zig 0.16.0 Debug, unit, CLI smoke and ReleaseFast checks.'
          git push origin HEAD:refactor/zig-clap-cli
